name: Legado CI — Full Compile + Unit Tests

# ====================================================================
# 触发条件：
#   - push 到任何分支
#   - 任何 PR 到任何分支
#   - 支持 workflow_dispatch 手动触发
# 路径过滤：以下文件变化才真实跑「全量编译+测试」，否则只跑 quick-probe（几秒钟）
# ====================================================================
on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'app/build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/legado-ci-full.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'app/build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/legado-ci-full.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "只编译 APK，跳过 unit test（更快出包）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # 主 Job：全量 APK 编译 (:app:assembleAppDebug) + Unit tests
  #   对齐 android-fast-debug.yml 的环境/JDK版本/清理策略
  # ================================================================
  full-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 与 android-fast-debug.yml 保持一致
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-XX:+UseParallelGC\ -Xmx4g\ -Xms256m\ -XX:MaxMetaspaceSize=768m\ -Dfile.encoding=UTF-8
        -Dorg.gradle.workers.max=2

    steps:
      # --------------------------------------------------------------
      # 1. 检出源码（fetch-depth=0，让 build.gradle 里的 git rev-list HEAD --count 能拿到正确 commits 数）
      # --------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # --------------------------------------------------------------
      # 2. JDK 17（与 kotlin jvmToolchain / compileSdk 36 匹配）
      # --------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # --------------------------------------------------------------
      # 3. AAPT2 + 32 位兼容依赖（Legado 构建过程需要）
      # --------------------------------------------------------------
      - name: Install AAPT2 runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6-i386 \
            lib32stdc++6 \
            lib32z1 \
            libncurses6 \
            libtinfo6

      # --------------------------------------------------------------
      # 4. gradlew 可执行
      # --------------------------------------------------------------
      - name: Grant gradlew permission
        run: chmod +x gradlew

      # --------------------------------------------------------------
      # 5. 生成 CI debug 签名（让 APK 能被 adb install 正常安装）
      #    与 android-fast-debug.yml 使用同一套别名/密码
      # --------------------------------------------------------------
      - name: Generate CI debug keystore
        run: |
          keytool -genkey -v \
            -keystore ci-debug.keystore \
            -alias legado-ci-debug \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass legado-ci-debug \
            -keypass legado-ci-debug \
            -dname "CN=Legado CI, OU=CI, O=Legado, L=Earth, ST=Earth, C=ZZ" \
            2>/dev/null || true
          ls -la ci-debug.keystore

      # --------------------------------------------------------------
      # 6. 清理 AAPT2/transforms 残留（GitHub 自带 ubuntu 偶发被污染；
      #    与 android-fast-debug.yml 保持同样的 sanitize 规则）
      # --------------------------------------------------------------
      - name: Sanitize Gradle AAPT2 caches
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon
          rm -rf ~/.gradle/native
          rm -rf ~/.gradle/caches/*/transforms
          rm -rf ~/.gradle/caches/*/transforms-*
          rm -rf ~/.gradle/caches/modules-2/files-2.1/com.android.tools.build/aapt2

      # --------------------------------------------------------------
      # 7. Gradle wrapper 缓存 + 依赖缓存（提升第 2 次及以后速度）
      # --------------------------------------------------------------
      - name: Cache Gradle wrapper dists
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/**/*.gradle*', 'gradle/**/*.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # --------------------------------------------------------------
      # 8. 全量编译 APK (:app:assembleAppDebug, 全部 ABI)
      #    VERSION_CODE = 当前 UTC 时间戳 / 60（每分钟唯一，避免和已有 build 冲突）
      # --------------------------------------------------------------
      - name: Step 1/2 — Full assembleAppDebug (ALL ABIs)
        id: assemble
        continue-on-error: false
        shell: bash -eo pipefail {0}
        run: |
          VERSION_CODE=$(($(date -u +%s) / 60))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          set +e
          ./gradlew :app:assembleAppDebug \
            -PVERSION_CODE="$VERSION_CODE" \
            -PRELEASE_STORE_FILE=ci-debug.keystore \
            -PRELEASE_STORE_PASSWORD=legado-ci-debug \
            -PRELEASE_KEY_ALIAS=legado-ci-debug \
            -PRELEASE_KEY_PASSWORD=legado-ci-debug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain \
            2>&1 | tee build-assemble.log
          ASSEMBLE_RC=$?
          if [ -n "${BASH_VERSINFO[*]}" ] && [ -n "${PIPESTATUS[0]}" ]; then
            ASSEMBLE_RC=${PIPESTATUS[0]}
          fi
          set -e
          echo "assemble_rc=$ASSEMBLE_RC" >> "$GITHUB_ENV"
          exit "$ASSEMBLE_RC"

      # --------------------------------------------------------------
      # 9. 跑 Unit Test (:app:testDebugUnitTest)
      #    - 包含视频模块 Phase A/B/C/D/E/AB/AC/Z/F 全链路 DryRun 测试
      #    - workflow_dispatch 下可手动 input.skip_tests=true 跳过
      # --------------------------------------------------------------
      - name: Step 2/2 — Run debug unit tests (Phase A-F)
        id: tests
        if: ${{ !inputs.skip_tests }}
        shell: bash -eo pipefail {0}
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain \
            2>&1 | tee build-test.log
          TEST_RC=$?
          if [ -n "${BASH_VERSINFO[*]}" ] && [ -n "${PIPESTATUS[0]}" ]; then
            TEST_RC=${PIPESTATUS[0]}
          fi
          set -e
          echo "test_rc=$TEST_RC" >> "$GITHUB_ENV"
          exit "$TEST_RC"

      # --------------------------------------------------------------
      # 10. 定位最终 APK / mapping / test reports
      # --------------------------------------------------------------
      - name: Resolve build artifacts
        id: resolve
        if: always()
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1 || true)
          APK_NAME=$(basename "$APK_PATH" 2>/dev/null || echo "")
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_exists=$([[ -n "$APK_PATH" && -f "$APK_PATH" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "size_kb=$([[ -n "$APK_PATH" && -f "$APK_PATH" ]] && echo $(( $(stat -c%s "$APK_PATH") / 1024 )) || echo 0)" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------
      # 11. 上传 APK Artifact（即使 test 失败也上传，方便下载排查）
      # --------------------------------------------------------------
      - name: Upload APK artifact
        if: always() && steps.resolve.outputs.apk_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: legado-app-debug-apk-${{ github.sha }}
          path: ${{ steps.resolve.outputs.apk_path }}
          compression-level: 7
          retention-days: 30
          if-no-files-found: ignore

      # --------------------------------------------------------------
      # 12. 上传 Unit Test HTML 报告（若有）+ 构建日志
      # --------------------------------------------------------------
      - name: Upload test report + build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ github.sha }}
          compression-level: 6
          retention-days: 14
          if-no-files-found: ignore
          path: |
            app/build/reports/**/*
            app/build/test-results/**/*
            build-assemble.log
            build-test.log

      # --------------------------------------------------------------
      # 13. 最终状态打印
      # --------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          echo "### CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${{ github.sha }}\` (branch \`${{ github.ref_name }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK 产物**:  ${{ steps.resolve.outputs.apk_name }}   (${{ steps.resolve.outputs.size_kb }} KB)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **assemble RC**:  ${{ env.assemble_rc }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **test RC**:      ${{ env.test_rc }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **视频模块测试**: Phase A/B/C/D/E/AB/AC/Z + (如 ffmpeg 环境) F" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts: APK → Artifact \`legado-app-debug-apk-*\`, 测试报告 → \`ci-reports-*\`" >> "$GITHUB_STEP_SUMMARY"
